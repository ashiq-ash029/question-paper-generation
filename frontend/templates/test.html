<!DOCTYPE html>
<html lang="en">
<head>
    <title>Automated Question Paper Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head> 
<body>
    <header>
        <!-- You can add a navigation bar or header content here if needed -->
    </header>

    <main class="container mt-5">
        <h2 class="text-center">Generate Questions from Paragraph</h2>
        
        <!-- Input Area for Paragraph -->
        <form id="paragraphForm" class="col-md-8 mx-auto" method="post" action="/generate">
            <div class="mb-3">
                <label for="paragraphInput" class="form-label">Enter Paragraph</label>
                <textarea class="form-control" id="paragraphInput" name="context" rows="5" placeholder="Paste your paragraph here..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Generate Questions</button>
        </form>

        <!-- Display Questions -->
        <div id="questions" class="mt-4">
            <h4>Generated Questions:</h4>
             {% if questions %}
              <ul id="questionsList">
                {% for question in questions %}
                  <li>{{ question }}</li>
                {% endfor %}
              </ul>
             {% endif %}
        </div>

    </main>

    <footer>
        <!-- Footer content if needed -->
    </footer>

    <script src="./js/bootstrap.bundle.min.js"></script>
